# Hooks run the tools from the Poetry venv, so versions always match poetry.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: poetry run mypy app tests
        language: system
        types: [python]
        pass_filenames: false
