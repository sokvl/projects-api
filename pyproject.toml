[project]
name = "projects-api"
version = "0.1.0"
description = "Project and document management API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi (>=0.162.0,<0.163.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "pydantic-settings (>=2.16.2,<3.0.0)", "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)", "asyncpg (>=0.32.0,<0.33.0)", "alembic (>=1.20.1,<2.0.0)", "pwdlib[argon2] (>=0.3.1,<0.4.0)", "pyjwt (>=2.15.1,<3.0.0)", "boto3 (>=1.44.1,<2.0.0)", "python-multipart (>=0.0.33,<0.0.34)", "email-validator (>=2.2,<3)"]

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "moto (>=5.2.5,<6.0.0)",
    "boto3-stubs[s3,ses] (>=1.44.1,<2.0.0)",
]
ui = [
    "nicegui (>=4.0.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
